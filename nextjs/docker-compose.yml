services:
  crypto-agent:
    build: .
    ports:
      - "${HOST_PORT:-3500}:3500"
    env_file:
      - ../.env.local
    volumes:
      # портфель, настройки и кэши переживают пересборку образа
      - ../data:/app/data
    restart: unless-stopped

  # Разбор портфеля дважды в день. Запускать вместе с профилем: docker compose --profile cron up -d
  agent-cron:
    build: .
    profiles: ["cron"]
    env_file:
      - ../.env.local
    environment:
      APP_URL: http://crypto-agent:3500
    volumes:
      - ../data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          H=$$(date +%H)
          if [ "$$H" = "09" ] || [ "$$H" = "21" ]; then node scripts/run-agent.mjs; sleep 3600; else sleep 600; fi
        done
    depends_on:
      - crypto-agent
    restart: unless-stopped
