<!DOCTYPE html>

        <nav class="main-nav">
          <p>РАБОЧЕЕ ПРОСТРАНСТВО</p>
          <a href="#/" data-nav="/" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />

          </a>

            </svg>
            Агент
          </a>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="breadcrumbs">
            <span>Мой портфель</span><i>/</i><strong id="crumb">Портфель</strong>
          </div>
        </header>
        <div class="content" id="view"></div>
      </section>
    </main>

    <div id="drawer-root"></div>
    <div id="modal-root"></div>

    <script src="/app.js"></script>

</html>
